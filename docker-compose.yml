# Full SleepJiraBot microservice fleet. Every service starts by default —
# there is no monolith mode. Mongo lives on the external apenkinpro_internal
# network; NATS + Redis are defined here. Inter-service URLs resolve to the
# compose service names.
services:
  # Auth + web + calendar service: OAuth /callback, landing/privacy/logo,
  # and the calendar feed poller (reminders fan out as events).
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      DEDUP_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      identity-svc:
        condition: service_started
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Jira token custody: the single refresh owner. Exposes POST
  # /internal/lease on :9080 for every token consumer in the fleet.
  identity-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/identity-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      INTERNAL_ADDR: ":9080"
    ports:
      - "9080:9080"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # User preferences (language, defaults, JQL filters, field mappings).
  preferences-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/preferences-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      PREFERENCES_SVC_ADDR: ":9082"
    ports:
      - "9082:9082"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Jira webhook ingress + 24h registration refresher. Sole owner of
  # /webhook; Jira's webhook URLs must point here.
  webhook-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/webhook-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      DEDUP_REDIS_URL: redis://redis:6379/0
      WEBHOOK_SVC_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      nats:
        condition: service_healthy
      identity-svc:
        condition: service_started
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Jira polling for every stored subscription.
  subscription-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/subscription-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      DEDUP_REDIS_URL: redis://redis:6379/0
      SUBSCRIPTION_SVC_ADDR: ":8082"
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy
      identity-svc:
        condition: service_started
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cron-triggered reports.
  scheduler-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/scheduler-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      SCHEDULER_SVC_ADDR: ":8083"
    ports:
      - "8083:8083"
    depends_on:
      nats:
        condition: service_healthy
      identity-svc:
        condition: service_started
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Telegram update-handling (commands, wizards, callbacks) + the sole
  # NotifyRequested consumer that delivers messages to Telegram.
  telegram-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/telegram-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      PREFERENCES_SVC_URL: http://preferences-svc:9082
      WEBHOOK_SVC_URL: http://webhook-svc:8081
      TELEGRAM_SVC_ADDR: ":8084"
    ports:
      - "8084:8084"
    depends_on:
      nats:
        condition: service_healthy
      identity-svc:
        condition: service_started
      preferences-svc:
        condition: service_started
      webhook-svc:
        condition: service_started
    networks:
      - default
      - mongo_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Shared Redis for distributed notifydedup across notifying services
  # (bot calendar poller, subscription-svc, webhook-svc).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nats_data:

networks:
  mongo_net:
    external: true
    name: apenkinpro_internal
