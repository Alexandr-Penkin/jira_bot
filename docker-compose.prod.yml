services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    container_name: bot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      caddy_net:
        aliases:
          - bot

  webhook-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/webhook-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      WEBHOOK_SVC_ADDR: ":8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    container_name: webhook-svc
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      caddy_net:
        aliases:
          - webhook-svc

networks:
  caddy_net:
    external: true
