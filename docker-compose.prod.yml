services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      DEDUP_REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    container_name: bot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      caddy_net:
        aliases:
          - bot
      jira_bot_default:
        aliases:
          - bot

  webhook-svc:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/webhook-svc
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NATS_URL: nats://nats:4222
      IDENTITY_SVC_URL: http://identity-svc:9080
      DEDUP_REDIS_URL: redis://redis:6379/0
      WEBHOOK_SVC_ADDR: ":8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    container_name: webhook-svc
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      caddy_net:
        aliases:
          - webhook-svc
      jira_bot_default:
        aliases:
          - webhook-svc

networks:
  caddy_net:
    external: true
  # Где живут jira_bot-nats-1, jira_bot-redis-1, jira_bot-*-svc-1.
  # Имя — `<project>_default`, проект `jira_bot` от базового docker-compose.yml.
  jira_bot_default:
    external: true
